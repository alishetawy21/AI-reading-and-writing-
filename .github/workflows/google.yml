
name: Android Professional Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. Checkout source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Verify Android project structure
      - name: Verify Project Structure
        shell: bash
        run: |
          echo "Checking Android project..."

          if [ ! -f "./gradlew" ]; then
            echo "::error::Gradle wrapper not found."
            exit 1
          fi

          chmod +x ./gradlew

          if [ ! -f "./settings.gradle" ] && \
             [ ! -f "./settings.gradle.kts" ] && \
             [ ! -f "./build.gradle" ] && \
             [ ! -f "./build.gradle.kts" ]; then
            echo "::error::No Gradle project configuration found."
            exit 1
          fi

          echo "Project structure verified."

      # 3. Configure Java
      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. Configure Gradle
      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 5. Configure Android SDK
      - name: Set Up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      # 6. Accept Android SDK licenses
      - name: Accept SDK Licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses || true

      # 7. Display build environment
      - name: Verify Build Environment
        run: |
          java -version
          ./gradlew --version
          sdkmanager --list_installed

      # 8. Build Android Debug APK
      - name: Build Android APK
        shell: bash
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      # 9. Locate APK
      - name: Verify APK Output
        shell: bash
        run: |
          mkdir -p release

          find . -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -not -path './release/*' \
            -exec cp {} release/ \;

          if [ -z "$(find release -name '*.apk' -print -quit)" ]; then
            echo "::error::No APK file was generated."
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh release/

      # 10. Upload APK artifact
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK-${{ github.run_number }}
          path: release/*.apk
          if-no-files-found: error
          retention-days: 30

      # 11. Upload diagnostic logs if build fails
      - name: Upload Build Diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Android-Build-Logs
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
